name: Publish Booking Package (manual)

# Manual trigger only, on purpose (Stage 1 of the roadmap in
# OXP_System_Connection_Roadmap_2026-09-03.md). A staff person runs this
# from the Actions tab with a booking's Airtable record ID after a status
# change, and reviews the diff before it goes live. Once this is proven
# reliable, Stage 2 can swap the trigger below for `repository_dispatch`
# fired by the Airtable "Ready to Move Forward" automation instead of a
# human clicking a button -- no other part of this file needs to change.
on:
  workflow_dispatch:
    inputs:
      booking_record_id:
        description: "Airtable Bookings record ID, e.g. rec4YP9ruVPOD90US"
        required: true
        type: string

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-docx

      - name: Generate confirmed page + contract from live Airtable data
        env:
          # Repo secret -- a read-only Airtable personal access token
          # scoped to the REEF Bookings | PILOT base (app3FIECuG8iQr7kY)
          # and the EPO base (appCK2qlT3WHdhYKd). See HANDOFF_INSTRUCTIONS.md
          # for how to create this and add it as a secret.
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          python pipeline/generate_booking_package.py "${{ github.event.inputs.booking_record_id }}"

      - name: Commit generated files
        run: |
          git config user.name "REEF Booking Pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add bookings/
          git diff --cached --quiet || git commit -m "Publish booking package for ${{ github.event.inputs.booking_record_id }}"
          git push
