name: Pipeline token read check (temporary)
# Temporary, branch-only, read-only. Prints HTTP status and row counts for the Checklist Items
# table using the pipeline's read token. Never prints the token or any row content.
on:
  push:
    branches: [claude/token-read-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read Checklist Items with AIRTABLE_API_KEY
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ["AIRTABLE_API_KEY"]
          base, table = "app3FIECuG8iQr7kY", "tbl6BmRXNhnxxfabD"
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + key})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, {"error": json.loads(e.read().decode() or "{}").get("error")}
          rows, offset, status = [], None, None
          while True:
              url = f"https://api.airtable.com/v0/{base}/{table}?returnFieldsByFieldId=true&fields%5B%5D=fldvPaPRRFhDtFRCW&fields%5B%5D=fldyIZDGmyfULPD8x&fields%5B%5D=flddmf1qgpHfyB48Z&fields%5B%5D=fldZFvEtmrZ5cZghT&fields%5B%5D=fldl9U7R5wd51QTCQ"
              if offset: url += "&offset=" + offset
              status, body = get(url)
              if status != 200:
                  print("TOKEN-CHECK read Checklist Items: HTTP", status, "error:", json.dumps(body.get("error"))[:200]); raise SystemExit(0)
              rows += body.get("records", [])
              offset = body.get("offset")
              if not offset: break
          per = {}
          for r in rows:
              for b in r["fields"].get("fldl9U7R5wd51QTCQ", []): per[b] = per.get(b, 0) + 1
          done = sum(1 for r in rows if r["fields"].get("fldyIZDGmyfULPD8x"))
          withdate = sum(1 for r in rows if r["fields"].get("flddmf1qgpHfyB48Z"))
          withby = sum(1 for r in rows if r["fields"].get("fldZFvEtmrZ5cZghT"))
          print(f"TOKEN-CHECK read Checklist Items: HTTP 200, rows={len(rows)}, bookings={len(per)}, rows per booking={sorted(per.values())}, done={done}, with Done On={withdate}, with Done By={withby}")
          PY
